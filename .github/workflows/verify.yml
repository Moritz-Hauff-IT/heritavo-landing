name: Verify

# Typecheck, Lint und Audit fuer jeden PR und vor jedem Image-Build
# (deploy.yml ruft diesen Workflow per workflow_call auf).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Wie im Dockerfile: npm install statt npm ci (Lockfile-Drift).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical
