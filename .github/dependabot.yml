# Dependabot fuer NPM, GitHub-Actions und Docker-Base-Image (gleiches Schema wie heritavo).
version: 2
updates:
  # Patch+Minor gruppiert (en bloc mergebar), Majors kommen einzeln.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      production-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 15
    labels:
      - "dependencies"

  # SHA-gepinnte Actions aktuell halten.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # Node-Base-Image im Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
